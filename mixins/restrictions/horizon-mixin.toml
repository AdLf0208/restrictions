[mod]
id = "restrictions"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "1d63e0a5a37a7a708eb0b32b49bf0dfeb28ed8a9"

# The content half is inside this bundle (`data/restrictions-content.hmod`, the built
# `content/restrictions.hmod`): this writes it to `.horizon-cache/` and appends it to the
# dev-mod list, so one `.hnmod` installs the blocks and the code. The registry keeps one file per
# project, so a split port could not be listed; AE2 ships the same pattern
# (`docs/native-mods.md`, "Data files").
[[injection]]
id = "embedded-content"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::mods::content_root"
helper = "embedded_content.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
  { name = "dev", ty = "&[std::path::PathBuf]", value = "dev" },
]

# The pure mover logic (standalone crate lib, injected as
# `crate::game::restrictions`).
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "restrictions"
source = "runtime.rs"

# Game-side glue: the block-entity declaration and its tick.
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "restrictions_state"
source = "support.rs"

# The mover blocks declare a block entity.
[[injection]]
id = "block-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "entity" },
]

# ... and say that it ticks.
[[injection]]
id = "block-entity-ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "ticks" },
]

# A placed block faces its placer (API 76): all four carried blocks declare
# the six-way `facing` property, as McJtyLib's rotation placement does.
[[injection]]
id = "facing-on-placement"
hook = "state_for_placement"
hook_version = 1
kind = "HEAD"
helper = "state_for_placement.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "self" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "context", ty = "&PlacementContext", value = "context" },
  { name = "answer", ty = "&mut Option<Option<BlockStateId>>", value = "answer" },
]

# One server tick: move mobs in the powered run in front.
[[injection]]
id = "block-entity-tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&horizon_client::containers::ModBlockEntity", value = "entity" },
]
